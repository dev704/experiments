<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Procedural Spiral Galaxy Generator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #000; font-family: 'Segoe UI', system-ui, sans-serif; color: #ccc; }
  canvas { display: block; }

  #controls {
    position: fixed; top: 12px; right: 12px;
    background: rgba(10, 10, 20, 0.85);
    border: 1px solid rgba(100, 120, 255, 0.25);
    border-radius: 10px;
    padding: 16px 18px;
    width: 260px;
    backdrop-filter: blur(12px);
    z-index: 100;
    max-height: calc(100vh - 24px);
    overflow-y: auto;
    transition: transform 0.3s ease;
  }
  #controls.collapsed { transform: translateX(calc(100% + 14px)); }
  #controls h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: 2px;
    color: rgba(160, 180, 255, 0.9); margin-bottom: 12px; text-align: center;
  }
  .ctrl-group { margin-bottom: 10px; }
  .ctrl-group label {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 11px; color: rgba(180, 190, 220, 0.8); margin-bottom: 3px;
  }
  .ctrl-group label span { color: rgba(130, 160, 255, 0.9); font-weight: 600; }
  input[type="range"] {
    -webkit-appearance: none; width: 100%; height: 4px;
    background: rgba(80, 100, 180, 0.3); border-radius: 2px; outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px;
    background: rgba(130, 160, 255, 0.8); border-radius: 50%; cursor: pointer;
  }
  select, button {
    width: 100%; padding: 7px 10px; margin-top: 4px;
    background: rgba(40, 50, 80, 0.6); color: #b0bfff;
    border: 1px solid rgba(100, 120, 255, 0.2); border-radius: 6px;
    font-size: 12px; cursor: pointer; outline: none;
  }
  button:hover { background: rgba(60, 70, 120, 0.7); }
  button.active { background: rgba(80, 100, 200, 0.5); border-color: rgba(130, 160, 255, 0.5); }
  .sep { border-top: 1px solid rgba(100, 120, 255, 0.12); margin: 10px 0; }

  #toggle-btn {
    position: fixed; top: 12px; right: 12px;
    background: rgba(10, 10, 20, 0.8); border: 1px solid rgba(100, 120, 255, 0.25);
    border-radius: 8px; padding: 8px 12px; color: #b0bfff;
    font-size: 18px; cursor: pointer; z-index: 101; display: none;
  }
  #toggle-btn.visible { display: block; }

  #info {
    position: fixed; bottom: 12px; left: 12px;
    font-size: 10px; color: rgba(140, 160, 220, 0.5);
    pointer-events: none; z-index: 100;
  }

  @media (max-width: 600px) {
    #controls { width: 220px; padding: 12px 14px; top: 8px; right: 8px; }
    #controls.collapsed { transform: translateX(calc(100% + 10px)); }
    #toggle-btn { top: 8px; right: 8px; }
  }
</style>
</head>
<body>

<div id="controls">
  <h2>🌌 Galaxy Controls</h2>

  <div class="ctrl-group">
    <label>Arms <span id="v-arms">3</span></label>
    <input type="range" id="arms" min="2" max="6" step="1" value="3">
  </div>
  <div class="ctrl-group">
    <label>Arm Tightness <span id="v-tightness">0.35</span></label>
    <input type="range" id="tightness" min="0.1" max="0.8" step="0.01" value="0.35">
  </div>
  <div class="ctrl-group">
    <label>Arm Spread <span id="v-spread">0.45</span></label>
    <input type="range" id="spread" min="0.1" max="1.2" step="0.01" value="0.45">
  </div>
  <div class="ctrl-group">
    <label>Core Size <span id="v-core">0.15</span></label>
    <input type="range" id="core" min="0.05" max="0.4" step="0.01" value="0.15">
  </div>
  <div class="ctrl-group">
    <label>Galaxy Radius <span id="v-radius">50</span></label>
    <input type="range" id="radius" min="20" max="100" step="1" value="50">
  </div>
  <div class="ctrl-group">
    <label>Rotation Speed <span id="v-rotation">0.02</span></label>
    <input type="range" id="rotation" min="0" max="0.1" step="0.002" value="0.02">
  </div>

  <div class="sep"></div>

  <div class="ctrl-group">
    <label>Color Theme</label>
    <select id="theme">
      <option value="realistic">Realistic</option>
      <option value="nebula">Nebula Heavy</option>
      <option value="infrared">Infrared False-Color</option>
    </select>
  </div>

  <div class="sep"></div>

  <button id="btn-autopilot">Autopilot Fly-Through</button>
  <button id="btn-regenerate" style="margin-top:6px">Regenerate Galaxy</button>
</div>

<button id="toggle-btn">⚙️</button>
<div id="info">Scroll to zoom · Drag to orbit · Procedural Galaxy Generator</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

// ─── Globals ───
let scene, camera, renderer, composer, controls, clock;
let starSystem, nebulaSystem, bgStars;
let galaxyGroup;
let autopilot = false;
let autopilotTime = 0;

const params = {
  arms: 3, tightness: 0.35, spread: 0.45,
  core: 0.15, radius: 50, rotation: 0.02,
  theme: 'realistic'
};

const STAR_COUNT = 180000;
const NEBULA_COUNT = 12000;
const BG_STAR_COUNT = 4000;

// ─── Color palettes ───
const palettes = {
  realistic: {
    coreInner: [1.0, 0.92, 0.7],
    coreOuter: [1.0, 0.75, 0.4],
    armOld:    [1.0, 0.85, 0.6],
    armYoung:  [0.5, 0.7, 1.0],
    armBlue:   [0.3, 0.5, 1.0],
    halo:      [1.0, 0.6, 0.3],
    nebPink:   [1.0, 0.3, 0.5],
    nebBlue:   [0.3, 0.4, 1.0],
    nebRed:    [0.9, 0.2, 0.2],
  },
  nebula: {
    coreInner: [1.0, 0.85, 0.95],
    coreOuter: [0.9, 0.5, 0.8],
    armOld:    [0.8, 0.6, 0.9],
    armYoung:  [0.4, 0.6, 1.0],
    armBlue:   [0.2, 0.4, 1.0],
    halo:      [0.7, 0.4, 0.6],
    nebPink:   [1.0, 0.2, 0.6],
    nebBlue:   [0.2, 0.3, 1.0],
    nebRed:    [0.8, 0.1, 0.4],
  },
  infrared: {
    coreInner: [1.0, 1.0, 0.3],
    coreOuter: [1.0, 0.6, 0.0],
    armOld:    [1.0, 0.3, 0.0],
    armYoung:  [0.0, 1.0, 0.5],
    armBlue:   [0.0, 0.8, 1.0],
    halo:      [0.8, 0.2, 0.0],
    nebPink:   [1.0, 0.0, 0.3],
    nebBlue:   [0.0, 0.6, 0.8],
    nebRed:    [1.0, 0.4, 0.0],
  }
};

// ─── Math helpers ───
function gaussRand() {
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
}

function lerp3(a, b, t) {
  return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];
}

// Logarithmic spiral: r = a * e^(b*theta)
function logSpiral(theta, a, b) {
  return a * Math.exp(b * theta);
}

// ─── Star shaders ───
const starVertexShader = `
  attribute float aSize;
  attribute float aAlpha;
  varying vec3 vColor;
  varying float vAlpha;
  void main() {
    vColor = color;
    vAlpha = aAlpha;
    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
    gl_PointSize = aSize * (200.0 / -mvPosition.z);
    gl_PointSize = clamp(gl_PointSize, 0.5, 40.0);
    gl_Position = projectionMatrix * mvPosition;
  }
`;

const starFragmentShader = `
  varying vec3 vColor;
  varying float vAlpha;
  void main() {
    vec2 uv = gl_PointCoord - 0.5;
    float d = length(uv);
    if (d > 0.5) discard;
    float glow = exp(-d * d * 8.0);
    float core = smoothstep(0.15, 0.0, d);
    float brightness = glow * 0.6 + core * 0.4;
    gl_FragColor = vec4(vColor * brightness, vAlpha * brightness);
  }
`;

const nebulaVertexShader = `
  attribute float aSize;
  attribute float aAlpha;
  varying vec3 vColor;
  varying float vAlpha;
  void main() {
    vColor = color;
    vAlpha = aAlpha;
    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
    gl_PointSize = aSize * (200.0 / -mvPosition.z);
    gl_PointSize = clamp(gl_PointSize, 1.0, 80.0);
    gl_Position = projectionMatrix * mvPosition;
  }
`;

const nebulaFragmentShader = `
  varying vec3 vColor;
  varying float vAlpha;
  void main() {
    vec2 uv = gl_PointCoord - 0.5;
    float d = length(uv);
    if (d > 0.5) discard;
    float soft = exp(-d * d * 3.0);
    gl_FragColor = vec4(vColor, vAlpha * soft * 0.35);
  }
`;

// ─── Galaxy generation ───
function generateGalaxy() {
  const pal = palettes[params.theme];
  const { arms, tightness, spread, core, radius } = params;

  // ── Stars ──
  const positions = new Float32Array(STAR_COUNT * 3);
  const colors = new Float32Array(STAR_COUNT * 3);
  const sizes = new Float32Array(STAR_COUNT);
  const alphas = new Float32Array(STAR_COUNT);

  const coreCount = Math.floor(STAR_COUNT * 0.2);
  const armCount = Math.floor(STAR_COUNT * 0.6);
  const haloCount = STAR_COUNT - coreCount - armCount;

  let idx = 0;

  // Core bulge — 3D gaussian, spheroidal
  for (let i = 0; i < coreCount; i++) {
    const r = Math.abs(gaussRand()) * radius * core;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const flatY = 0.4; // slightly oblate

    const x = r * Math.sin(phi) * Math.cos(theta);
    const y = r * Math.cos(phi) * flatY;
    const z = r * Math.sin(phi) * Math.sin(theta);

    positions[idx * 3] = x;
    positions[idx * 3 + 1] = y;
    positions[idx * 3 + 2] = z;

    const t = Math.min(r / (radius * core), 1.0);
    const col = lerp3(pal.coreInner, pal.coreOuter, t);
    colors[idx * 3] = col[0];
    colors[idx * 3 + 1] = col[1];
    colors[idx * 3 + 2] = col[2];

    sizes[idx] = 1.0 + Math.random() * 1.5;
    alphas[idx] = 0.7 + Math.random() * 0.3;
    idx++;
  }

  // Arm stars — logarithmic spiral with gaussian dispersion
  for (let i = 0; i < armCount; i++) {
    const armIdx = Math.floor(Math.random() * arms);
    const armAngle = (armIdx / arms) * Math.PI * 2;

    // Distance along arm — weighted toward inner regions
    const t = Math.random();
    const dist = t * t * radius;

    // Logarithmic spiral angle
    const spiralAngle = armAngle + tightness * Math.log(1 + dist / (radius * 0.1));

    // Gaussian dispersion perpendicular to arm
    const spreadAmount = spread * (0.3 + dist / radius * 0.7);
    const offsetAngle = gaussRand() * spreadAmount * 0.15;
    const offsetR = gaussRand() * spreadAmount * 1.5;

    const finalAngle = spiralAngle + offsetAngle;
    const finalR = dist + offsetR;

    const x = finalR * Math.cos(finalAngle);
    const z = finalR * Math.sin(finalAngle);
    const y = gaussRand() * (0.3 + dist * 0.02) * 0.5; // thin disk

    positions[idx * 3] = x;
    positions[idx * 3 + 1] = y;
    positions[idx * 3 + 2] = z;

    // Color: mix old and young based on arm proximity + randomness
    const armProximity = Math.exp(-Math.abs(offsetAngle) * 8);
    const isYoung = armProximity > 0.5 && Math.random() < 0.35;
    const isBlue = armProximity > 0.7 && Math.random() < 0.15;

    let col;
    if (isBlue) {
      col = pal.armBlue;
    } else if (isYoung) {
      col = lerp3(pal.armOld, pal.armYoung, 0.3 + Math.random() * 0.7);
    } else {
      const warmth = 0.5 + Math.random() * 0.5;
      col = lerp3(pal.armYoung, pal.armOld, warmth);
    }

    // Radial color gradient — inner warmer
    const radialFade = Math.min(dist / radius, 1.0);
    col = lerp3(pal.coreOuter, col, Math.min(radialFade * 2, 1.0));

    colors[idx * 3] = col[0];
    colors[idx * 3 + 1] = col[1];
    colors[idx * 3 + 2] = col[2];

    sizes[idx] = isBlue ? 1.2 + Math.random() * 1.8 : 0.5 + Math.random() * 1.2;
    alphas[idx] = 0.5 + Math.random() * 0.5;
    idx++;
  }

  // Halo / globular cluster stars
  for (let i = 0; i < haloCount; i++) {
    const r = (Math.random() + Math.random()) * radius * 0.8;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);

    const x = r * Math.sin(phi) * Math.cos(theta);
    const y = r * Math.cos(phi) * 0.6;
    const z = r * Math.sin(phi) * Math.sin(theta);

    positions[idx * 3] = x;
    positions[idx * 3 + 1] = y;
    positions[idx * 3 + 2] = z;

    const col = lerp3(pal.halo, pal.coreOuter, Math.random() * 0.4);
    colors[idx * 3] = col[0];
    colors[idx * 3 + 1] = col[1];
    colors[idx * 3 + 2] = col[2];

    sizes[idx] = 0.3 + Math.random() * 0.7;
    alphas[idx] = 0.2 + Math.random() * 0.4;
    idx++;
  }

  // ── Nebula particles ──
  const nebPos = new Float32Array(NEBULA_COUNT * 3);
  const nebCol = new Float32Array(NEBULA_COUNT * 3);
  const nebSizes = new Float32Array(NEBULA_COUNT);
  const nebAlphas = new Float32Array(NEBULA_COUNT);

  for (let i = 0; i < NEBULA_COUNT; i++) {
    const armIdx = Math.floor(Math.random() * arms);
    const armAngle = (armIdx / arms) * Math.PI * 2;

    const t = Math.random();
    const dist = (0.15 + t * t * 0.85) * radius;

    const spiralAngle = armAngle + tightness * Math.log(1 + dist / (radius * 0.1));
    const offsetAngle = gaussRand() * spread * 0.1;
    const offsetR = gaussRand() * spread * 1.0;

    const finalAngle = spiralAngle + offsetAngle;
    const finalR = dist + offsetR;

    nebPos[i * 3] = finalR * Math.cos(finalAngle);
    nebPos[i * 3 + 1] = gaussRand() * 0.4;
    nebPos[i * 3 + 2] = finalR * Math.sin(finalAngle);

    // H-II region colours
    const pick = Math.random();
    let col;
    if (pick < 0.45) col = pal.nebPink;
    else if (pick < 0.75) col = pal.nebBlue;
    else col = pal.nebRed;

    // Slight variation
    nebCol[i * 3] = col[0] + (Math.random() - 0.5) * 0.15;
    nebCol[i * 3 + 1] = col[1] + (Math.random() - 0.5) * 0.15;
    nebCol[i * 3 + 2] = col[2] + (Math.random() - 0.5) * 0.15;

    nebSizes[i] = 2.0 + Math.random() * 5.0;
    nebAlphas[i] = 0.08 + Math.random() * 0.2;
  }

  return { positions, colors, sizes, alphas, nebPos, nebCol, nebSizes, nebAlphas };
}

// ─── Scene setup ───
function init() {
  scene = new THREE.Scene();
  clock = new THREE.Clock();

  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 35, 65);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  document.body.appendChild(renderer.domElement);

  // Bloom
  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  const bloom = new UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight),
    0.8, 0.4, 0.85
  );
  composer.addPass(bloom);

  // Controls
  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 5;
  controls.maxDistance = 200;
  controls.target.set(0, 0, 0);
  controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };

  // Galaxy group for rotation
  galaxyGroup = new THREE.Group();
  scene.add(galaxyGroup);

  // Background starfield
  createBackgroundStars();

  // Generate galaxy
  buildGalaxy();

  // Events
  window.addEventListener('resize', onResize);
  setupControls();

  animate();
}

function createBackgroundStars() {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(BG_STAR_COUNT * 3);
  const col = new Float32Array(BG_STAR_COUNT * 3);

  for (let i = 0; i < BG_STAR_COUNT; i++) {
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const r = 300 + Math.random() * 200;
    pos[i*3]   = r * Math.sin(phi) * Math.cos(theta);
    pos[i*3+1] = r * Math.cos(phi);
    pos[i*3+2] = r * Math.sin(phi) * Math.sin(theta);

    const brightness = 0.3 + Math.random() * 0.7;
    const warm = Math.random();
    col[i*3]   = brightness * (0.8 + warm * 0.2);
    col[i*3+1] = brightness * (0.8 + warm * 0.1);
    col[i*3+2] = brightness;
  }

  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));

  const mat = new THREE.PointsMaterial({
    size: 0.8, vertexColors: true, transparent: true, opacity: 0.8,
    blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: false
  });

  bgStars = new THREE.Points(geo, mat);
  scene.add(bgStars);
}

function buildGalaxy() {
  // Remove old
  if (starSystem) galaxyGroup.remove(starSystem);
  if (nebulaSystem) galaxyGroup.remove(nebulaSystem);

  const data = generateGalaxy();

  // Stars
  const starGeo = new THREE.BufferGeometry();
  starGeo.setAttribute('position', new THREE.BufferAttribute(data.positions, 3));
  starGeo.setAttribute('color', new THREE.BufferAttribute(data.colors, 3));
  starGeo.setAttribute('aSize', new THREE.BufferAttribute(data.sizes, 1));
  starGeo.setAttribute('aAlpha', new THREE.BufferAttribute(data.alphas, 1));

  const starMat = new THREE.ShaderMaterial({
    vertexShader: starVertexShader,
    fragmentShader: starFragmentShader,
    vertexColors: true,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  });

  starSystem = new THREE.Points(starGeo, starMat);
  galaxyGroup.add(starSystem);

  // Nebulae
  const nebGeo = new THREE.BufferGeometry();
  nebGeo.setAttribute('position', new THREE.BufferAttribute(data.nebPos, 3));
  nebGeo.setAttribute('color', new THREE.BufferAttribute(data.nebCol, 3));
  nebGeo.setAttribute('aSize', new THREE.BufferAttribute(data.nebSizes, 1));
  nebGeo.setAttribute('aAlpha', new THREE.BufferAttribute(data.nebAlphas, 1));

  const nebMat = new THREE.ShaderMaterial({
    vertexShader: nebulaVertexShader,
    fragmentShader: nebulaFragmentShader,
    vertexColors: true,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  });

  nebulaSystem = new THREE.Points(nebGeo, nebMat);
  galaxyGroup.add(nebulaSystem);
}

// ─── Autopilot path ───
function getAutopilotPosition(t) {
  // Spiral fly-through path
  const phase = t * 0.15;
  const r = 15 + Math.sin(t * 0.05) * 25;
  const x = r * Math.cos(phase);
  const z = r * Math.sin(phase);
  const y = 5 + Math.sin(t * 0.08) * 15 + Math.cos(t * 0.03) * 10;
  return new THREE.Vector3(x, y, z);
}

// ─── Animation ───
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();

  // Galaxy rotation
  galaxyGroup.rotation.y += params.rotation * dt;

  // Autopilot
  if (autopilot) {
    autopilotTime += dt;
    const pos = getAutopilotPosition(autopilotTime);
    camera.position.lerp(pos, 0.02);

    // Look toward center with slight offset
    const lookTarget = new THREE.Vector3(
      Math.sin(autopilotTime * 0.03) * 5,
      Math.sin(autopilotTime * 0.05) * 2,
      Math.cos(autopilotTime * 0.03) * 5
    );
    controls.target.lerp(lookTarget, 0.02);
  }

  controls.update();
  composer.render();
}

// ─── UI ───
function setupControls() {
  const sliders = ['arms', 'tightness', 'spread', 'core', 'radius', 'rotation'];
  sliders.forEach(name => {
    const el = document.getElementById(name);
    const display = document.getElementById('v-' + name);
    el.addEventListener('input', () => {
      const val = parseFloat(el.value);
      params[name] = val;
      display.textContent = val;
      if (name !== 'rotation') buildGalaxy();
    });
  });

  document.getElementById('theme').addEventListener('change', (e) => {
    params.theme = e.target.value;
    buildGalaxy();
  });

  const apBtn = document.getElementById('btn-autopilot');
  apBtn.addEventListener('click', () => {
    autopilot = !autopilot;
    apBtn.classList.toggle('active', autopilot);
    apBtn.textContent = autopilot ? '⏹ Stop Autopilot' : 'Autopilot Fly-Through';
    if (autopilot) {
      autopilotTime = 0;
      controls.enabled = false;
    } else {
      controls.enabled = true;
    }
  });

  document.getElementById('btn-regenerate').addEventListener('click', buildGalaxy);

  // Toggle panel on mobile
  const toggleBtn = document.getElementById('toggle-btn');
  const panel = document.getElementById('controls');

  function checkMobile() {
    if (window.innerWidth <= 600) {
      panel.classList.add('collapsed');
      toggleBtn.classList.add('visible');
    } else {
      panel.classList.remove('collapsed');
      toggleBtn.classList.remove('visible');
    }
  }

  toggleBtn.addEventListener('click', () => {
    panel.classList.toggle('collapsed');
  });

  window.addEventListener('resize', checkMobile);
  checkMobile();
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
}

// ─── Launch ───
init();
</script>
