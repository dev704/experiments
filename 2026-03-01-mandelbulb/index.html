<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mandelbulb Explorer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Segoe UI',system-ui,sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}
#ui{position:fixed;top:16px;right:16px;background:rgba(10,10,18,0.82);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:16px 20px;color:#ccc;font-size:13px;min-width:200px;z-index:10;user-select:none}
#ui h2{font-size:14px;color:#fff;margin-bottom:12px;font-weight:600;letter-spacing:.5px}
.ctrl{margin-bottom:10px}
.ctrl label{display:flex;justify-content:space-between;margin-bottom:3px;font-size:12px}
.ctrl label span{color:#888}
.ctrl input[type=range]{width:100%;accent-color:#7a5af5;height:4px}
.ctrl select{width:100%;background:rgba(255,255,255,0.07);color:#ddd;border:1px solid rgba(255,255,255,0.12);border-radius:6px;padding:4px 8px;font-size:12px}
#fps{position:fixed;bottom:12px;left:12px;color:rgba(255,255,255,0.35);font:11px monospace;z-index:10}
#hint{position:fixed;bottom:12px;right:12px;color:rgba(255,255,255,0.25);font:11px/1.4 sans-serif;text-align:right;z-index:10}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <h2>⬡ Mandelbulb</h2>
  <div class="ctrl"><label>Power <span id="vPow">8</span></label><input type="range" id="power" min="2" max="20" step="0.1" value="8"></div>
  <div class="ctrl"><label>Iterations <span id="vIter">15</span></label><input type="range" id="iter" min="2" max="50" step="1" value="15"></div>
  <div class="ctrl"><label>AO Strength <span id="vAo">0.7</span></label><input type="range" id="ao" min="0" max="1.5" step="0.05" value="0.7"></div>
  <div class="ctrl"><label>Palette</label><select id="palette"><option value="0">Magma</option><option value="1">Ocean</option><option value="2">Neon</option><option value="3">Grayscale</option><option value="4">Alien</option></select></div>
</div>
<div id="fps"></div>
<div id="hint">drag: rotate · scroll: zoom</div>
<script>
const canvas=document.getElementById('c'),gl=canvas.getContext('webgl2',{antialias:false,powerPreference:'high-performance'});
if(!gl){document.body.innerHTML='<p style="color:#fff;padding:2em">WebGL 2 not supported</p>';throw'no webgl2'}

// --- Shader sources ---
const VS=`#version 300 es
in vec2 a;out vec2 uv;void main(){uv=a;gl_Position=vec4(a,0,1);}`;

const FS=`#version 300 es
precision highp float;
in vec2 uv;out vec4 O;
uniform vec2 res;
uniform float time,power,maxIter,aoStr;
uniform int palette;
uniform vec3 camPos;
uniform mat3 camRot;

// Mandelbulb DE
vec2 mandelbulb(vec3 p){
  vec3 z=p;
  float dr=1.0,r=0.0,trap=1e10;
  float pw=power;
  int mi=int(maxIter);
  for(int i=0;i<50;i++){
    if(i>=mi)break;
    r=length(z);
    if(r>2.0)break;
    float theta=acos(z.z/r);
    float phi=atan(z.y,z.x);
    dr=pow(r,pw-1.0)*pw*dr+1.0;
    float zr=pow(r,pw);
    theta*=pw;phi*=pw;
    z=zr*vec3(sin(theta)*cos(phi),sin(theta)*sin(phi),cos(theta))+p;
    trap=min(trap,length(z));
  }
  return vec2(0.5*log(r)*r/dr, trap);
}

// Soft shadow
float shadow(vec3 ro,vec3 rd,float mint,float maxt,float k){
  float res=1.0;
  float t=mint;
  for(int i=0;i<32;i++){
    vec2 d=mandelbulb(ro+rd*t);
    if(d.x<0.0002){return 0.05;}
    res=min(res,k*d.x/t);
    t+=clamp(d.x,0.005,0.1);
    if(t>maxt)break;
  }
  return clamp(res,0.05,1.0);
}

// Normal via central differences
vec3 normal(vec3 p){
  vec2 e=vec2(0.0005,0);
  return normalize(vec3(
    mandelbulb(p+e.xyy).x-mandelbulb(p-e.xyy).x,
    mandelbulb(p+e.yxy).x-mandelbulb(p-e.yxy).x,
    mandelbulb(p+e.yyx).x-mandelbulb(p-e.yyx).x));
}

// Palettes
vec3 pal_magma(float t){
  t=clamp(t,0.0,1.0);
  return mix(mix(vec3(0.01,0.0,0.07),vec3(0.55,0.05,0.45),smoothstep(0.0,0.35,t)),
             mix(vec3(0.95,0.35,0.15),vec3(1.0,0.95,0.7),smoothstep(0.65,1.0,t)),
             smoothstep(0.35,0.65,t));
}
vec3 pal_ocean(float t){
  t=clamp(t,0.0,1.0);
  return mix(mix(vec3(0.0,0.02,0.12),vec3(0.0,0.25,0.55),smoothstep(0.0,0.35,t)),
             mix(vec3(0.1,0.6,0.7),vec3(0.7,0.95,1.0),smoothstep(0.65,1.0,t)),
             smoothstep(0.35,0.65,t));
}
vec3 pal_neon(float t){
  t=clamp(t,0.0,1.0);
  vec3 a=vec3(0.5),b=vec3(0.5),c=vec3(1.0,1.0,0.5),d=vec3(0.8,0.9,0.3);
  return a+b*cos(6.28318*(c*t+d));
}
vec3 pal_gray(float t){return vec3(clamp(t,0.0,1.0));}
vec3 pal_alien(float t){
  t=clamp(t,0.0,1.0);
  return mix(mix(vec3(0.0,0.08,0.02),vec3(0.15,0.5,0.1),smoothstep(0.0,0.3,t)),
             mix(vec3(0.6,0.2,0.8),vec3(1.0,0.85,0.5),smoothstep(0.6,1.0,t)),
             smoothstep(0.3,0.6,t));
}
vec3 getColor(float t){
  if(palette==0)return pal_magma(t);
  if(palette==1)return pal_ocean(t);
  if(palette==2)return pal_neon(t);
  if(palette==3)return pal_gray(t);
  return pal_alien(t);
}

void main(){
  vec2 p=(gl_FragCoord.xy-0.5*res)/res.y;
  vec3 rd=normalize(camRot*vec3(p,1.5));
  vec3 ro=camPos;

  float t=0.0;
  vec2 h;
  int steps=0;
  for(int i=0;i<128;i++){
    h=mandelbulb(ro+rd*t);
    if(h.x<0.0003||t>6.0)break;
    t+=h.x*0.7; // slight understep for safety
    steps=i;
  }

  vec3 col=vec3(0.01,0.01,0.02);
  if(t<6.0&&h.x<0.0003){
    vec3 pos=ro+rd*t;
    vec3 n=normal(pos);

    // Lighting
    vec3 light1=normalize(vec3(0.8,1.2,0.6));
    vec3 light2=normalize(vec3(-0.5,0.3,-0.8));
    float diff1=max(dot(n,light1),0.0);
    float diff2=max(dot(n,light2),0.0);

    // Soft shadow from main light
    float sh=shadow(pos+n*0.002,light1,0.01,2.0,12.0);

    // AO from step count
    float ao=1.0-aoStr*float(steps)/128.0;

    // Specular
    vec3 ref=reflect(rd,n);
    float spec=pow(max(dot(ref,light1),0.0),32.0)*0.5;

    // Colour from orbit trap
    vec3 mat=getColor(h.y*0.8);

    col=mat*(diff1*sh*0.9+diff2*0.15+0.1)*ao+spec*sh*vec3(1.0,0.95,0.9);

    // Fog
    col=mix(col,vec3(0.01,0.01,0.02),1.0-exp(-t*t*0.15));
  }

  // Gamma + slight vignette
  col=pow(col,vec3(0.4545));
  float vig=1.0-0.3*dot(uv,uv);
  col*=vig;

  O=vec4(col,1);
}`;

// Compile
function compile(src,type){
  const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){console.error(gl.getShaderInfoLog(s));return null;}
  return s;
}
const prog=gl.createProgram();
gl.attachShader(prog,compile(VS,gl.VERTEX_SHADER));
gl.attachShader(prog,compile(FS,gl.FRAGMENT_SHADER));
gl.linkProgram(prog);gl.useProgram(prog);

// Fullscreen quad
const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const a=gl.getAttribLocation(prog,'a');gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);

// Uniforms
const U={};
['res','time','power','maxIter','aoStr','palette','camPos','camRot'].forEach(n=>U[n]=gl.getUniformLocation(prog,n));

// Camera
let theta=0.4,phi=0.8,dist=2.8;
const isMobile=/Mobi|Android/i.test(navigator.userAgent);
let pixelRatio=isMobile?0.5:Math.min(window.devicePixelRatio,1.5);

function resize(){
  const w=window.innerWidth,h=window.innerHeight;
  canvas.width=Math.floor(w*pixelRatio);canvas.height=Math.floor(h*pixelRatio);
  gl.viewport(0,0,canvas.width,canvas.height);
}
window.addEventListener('resize',resize);resize();

// Mouse controls
let dragging=false,lastX,lastY;
canvas.addEventListener('pointerdown',e=>{if(e.target===canvas){dragging=true;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId);}});
canvas.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;theta-=dx*0.005;phi=Math.max(0.05,Math.min(Math.PI-0.05,phi-dy*0.005));lastX=e.clientX;lastY=e.clientY;});
canvas.addEventListener('pointerup',()=>dragging=false);
canvas.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(1.2,Math.min(8,dist+e.deltaY*0.003));},{passive:false});

// Touch pinch
let pinchDist=0;
canvas.addEventListener('touchstart',e=>{if(e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;pinchDist=Math.sqrt(dx*dx+dy*dy);}},{passive:true});
canvas.addEventListener('touchmove',e=>{if(e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;const d=Math.sqrt(dx*dx+dy*dy);dist=Math.max(1.2,Math.min(8,dist-((d-pinchDist)*0.008)));pinchDist=d;}},{passive:true});

// UI bindings
const elPow=document.getElementById('power'),elIter=document.getElementById('iter'),elAo=document.getElementById('ao'),elPal=document.getElementById('palette');
const vPow=document.getElementById('vPow'),vIter=document.getElementById('vIter'),vAo=document.getElementById('vAo');
elPow.oninput=()=>vPow.textContent=parseFloat(elPow.value).toFixed(1);
elIter.oninput=()=>vIter.textContent=elIter.value;
elAo.oninput=()=>vAo.textContent=parseFloat(elAo.value).toFixed(2);

// FPS counter
let frames=0,lastFps=performance.now();const fpsEl=document.getElementById('fps');

// Render loop
function render(t){
  frames++;
  const now=performance.now();
  if(now-lastFps>500){fpsEl.textContent=Math.round(frames/((now-lastFps)/1000))+' fps';frames=0;lastFps=now;}

  gl.uniform2f(U.res,canvas.width,canvas.height);
  gl.uniform1f(U.time,t*0.001);
  gl.uniform1f(U.power,parseFloat(elPow.value));
  gl.uniform1f(U.maxIter,parseFloat(elIter.value));
  gl.uniform1f(U.aoStr,parseFloat(elAo.value));
  gl.uniform1i(U.palette,parseInt(elPal.value));

  // Camera matrix
  const cp=Math.cos(phi),sp=Math.sin(phi),ct=Math.cos(theta),st=Math.sin(theta);
  const eye=[dist*sp*ct, dist*cp, dist*sp*st];
  gl.uniform3f(U.camPos,eye[0],eye[1],eye[2]);

  // Build look-at rotation matrix
  const fwd=[-eye[0],-eye[1],-eye[2]];
  const fl=Math.sqrt(fwd[0]*fwd[0]+fwd[1]*fwd[1]+fwd[2]*fwd[2]);
  fwd[0]/=fl;fwd[1]/=fl;fwd[2]/=fl;
  const up=[0,1,0];
  const right=[fwd[1]*up[2]-fwd[2]*up[1],fwd[2]*up[0]-fwd[0]*up[2],fwd[0]*up[1]-fwd[1]*up[0]];
  const rl=Math.sqrt(right[0]*right[0]+right[1]*right[1]+right[2]*right[2]);
  right[0]/=rl;right[1]/=rl;right[2]/=rl;
  const nup=[right[1]*fwd[2]-right[2]*fwd[1],right[2]*fwd[0]-right[0]*fwd[2],right[0]*fwd[1]-right[1]*fwd[0]];
  gl.uniformMatrix3fv(U.camRot,false,[right[0],nup[0],fwd[0],right[1],nup[1],fwd[1],right[2],nup[2],fwd[2]]);

  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  requestAnimationFrame(render);
}
requestAnimationFrame(render);
</script>
</body>
</html>
