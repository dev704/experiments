<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Fluid Simulation — Navier-Stokes on GPU</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; color: #fff; }
canvas { display: block; width: 100vw; height: 100vh; }

#title {
  position: fixed; top: 20px; left: 24px; pointer-events: none; z-index: 10;
  text-shadow: 0 0 20px rgba(0,200,255,0.4);
}
#title h1 { font-size: 22px; font-weight: 300; letter-spacing: 2px; color: #e0f0ff; }
#title p { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: #6af; opacity: 0.7; margin-top: 2px; }

#controls {
  position: fixed; top: 20px; right: 20px; z-index: 10;
  background: rgba(10,12,20,0.85); border: 1px solid rgba(100,170,255,0.15);
  border-radius: 10px; padding: 16px 18px; min-width: 220px;
  backdrop-filter: blur(10px); transition: all 0.3s;
}
#controls.collapsed { min-width: 0; padding: 10px 14px; }
#controls.collapsed .ctrl-body { display: none; }
#toggle-btn {
  background: none; border: none; color: #6af; cursor: pointer; font-size: 13px;
  letter-spacing: 1px; text-transform: uppercase; padding: 0; margin-bottom: 10px; display: block;
}
#controls.collapsed #toggle-btn { margin-bottom: 0; }
.ctrl-row { margin-bottom: 10px; }
.ctrl-row label { display: block; font-size: 11px; color: #8ab; letter-spacing: 0.5px; margin-bottom: 3px; }
.ctrl-row input[type=range] { width: 100%; accent-color: #6af; }
.ctrl-row select {
  width: 100%; background: rgba(30,40,60,0.8); color: #cde; border: 1px solid rgba(100,170,255,0.2);
  border-radius: 4px; padding: 4px 6px; font-size: 12px;
}
.btn-row { display: flex; gap: 8px; margin-top: 12px; }
.btn-row button {
  flex: 1; padding: 6px 0; border-radius: 5px; border: 1px solid rgba(100,170,255,0.25);
  background: rgba(30,50,80,0.5); color: #8cf; cursor: pointer; font-size: 12px;
  letter-spacing: 0.5px; transition: background 0.2s;
}
.btn-row button:hover { background: rgba(50,80,130,0.6); }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="title"><h1>Fluid Simulation</h1><p>Navier-Stokes on GPU</p></div>

<div id="controls">
  <button id="toggle-btn">▼ Controls</button>
  <div class="ctrl-body">
    <div class="ctrl-row">
      <label>Viscosity: <span id="v-visc">0.3</span></label>
      <input type="range" id="viscosity" min="0" max="2" step="0.01" value="0.3">
    </div>
    <div class="ctrl-row">
      <label>Dye Dissipation: <span id="v-diss">0.98</span></label>
      <input type="range" id="dissipation" min="0.9" max="1" step="0.002" value="0.98">
    </div>
    <div class="ctrl-row">
      <label>Brush Size: <span id="v-brush">0.012</span></label>
      <input type="range" id="brush" min="0.002" max="0.05" step="0.001" value="0.012">
    </div>
    <div class="ctrl-row">
      <label>Force: <span id="v-force">300</span></label>
      <input type="range" id="force" min="50" max="1000" step="10" value="300">
    </div>
    <div class="ctrl-row">
      <label>Vorticity: <span id="v-curl">30</span></label>
      <input type="range" id="curl" min="0" max="80" step="1" value="30">
    </div>
    <div class="ctrl-row">
      <label>Bloom Intensity: <span id="v-bloom">0.6</span></label>
      <input type="range" id="bloom" min="0" max="1.5" step="0.05" value="0.6">
    </div>
    <div class="ctrl-row">
      <label>Display Mode</label>
      <select id="mode">
        <option value="0">Dye</option>
        <option value="1">Velocity</option>
        <option value="2">Pressure</option>
        <option value="3">Vorticity</option>
      </select>
    </div>
    <div class="btn-row">
      <button id="pause">Pause</button>
      <button id="clear">Clear</button>
    </div>
  </div>
</div>

<script>
"use strict";

const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { alpha: false, depth: false, stencil: false, antialias: false, preserveDrawingBuffer: false });
if (!gl) { document.body.innerHTML = '<h1 style="color:#f66;padding:40px">WebGL 2 not supported</h1>'; throw 'no webgl2'; }

// Extensions
const extFloat = gl.getExtension('EXT_color_buffer_float');
const halfFloat = !extFloat ? gl.getExtension('EXT_color_buffer_half_float') : null;
const useHalf = !extFloat;
const floatType = useHalf ? gl.HALF_FLOAT : gl.FLOAT;
const texFilter = gl.LINEAR;

// Check linear filtering for float
gl.getExtension('OES_texture_float_linear');
gl.getExtension('OES_texture_half_float_linear');

// Sim dimensions
let simW, simH, dyeW, dyeH;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.floor(window.innerWidth * dpr);
  canvas.height = Math.floor(window.innerHeight * dpr);
  const aspect = canvas.width / canvas.height;
  simW = aspect >= 1 ? 512 : Math.floor(512 * aspect);
  simH = aspect >= 1 ? Math.floor(512 / aspect) : 512;
  dyeW = aspect >= 1 ? 1024 : Math.floor(1024 * aspect);
  dyeH = aspect >= 1 ? Math.floor(1024 / aspect) : 1024;
}

// Shader compilation
function compileShader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(s), src); return null; }
  return s;
}

function createProgram(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, vs);
  gl.attachShader(p, fs);
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(p));
  const uniforms = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) {
    const info = gl.getActiveUniform(p, i);
    uniforms[info.name] = gl.getUniformLocation(p, info.name);
  }
  return { program: p, uniforms };
}

const baseVS = `#version 300 es
precision highp float;
in vec2 aPosition;
out vec2 vUv;
void main() {
  vUv = aPosition * 0.5 + 0.5;
  gl_Position = vec4(aPosition, 0.0, 1.0);
}`;

const vs = compileShader(gl.VERTEX_SHADER, baseVS);

function prog(fragSrc) {
  const fs = compileShader(gl.FRAGMENT_SHADER, `#version 300 es
precision highp float;
precision highp sampler2D;
in vec2 vUv;
out vec4 fragColor;
${fragSrc}`);
  return createProgram(vs, fs);
}

// Programs
const advectionProg = prog(`
uniform sampler2D uVelocity;
uniform sampler2D uSource;
uniform vec2 texelSize;
uniform float dt;
uniform float dissipation;
void main() {
  vec2 coord = vUv - dt * texture(uVelocity, vUv).xy * texelSize;
  fragColor = dissipation * texture(uSource, coord);
}`);

const divergenceProg = prog(`
uniform sampler2D uVelocity;
uniform vec2 texelSize;
void main() {
  float L = texture(uVelocity, vUv - vec2(texelSize.x, 0)).x;
  float R = texture(uVelocity, vUv + vec2(texelSize.x, 0)).x;
  float B = texture(uVelocity, vUv - vec2(0, texelSize.y)).y;
  float T = texture(uVelocity, vUv + vec2(0, texelSize.y)).y;
  fragColor = vec4(0.5 * (R - L + T - B), 0.0, 0.0, 1.0);
}`);

const pressureProg = prog(`
uniform sampler2D uPressure;
uniform sampler2D uDivergence;
uniform vec2 texelSize;
void main() {
  float L = texture(uPressure, vUv - vec2(texelSize.x, 0)).x;
  float R = texture(uPressure, vUv + vec2(texelSize.x, 0)).x;
  float B = texture(uPressure, vUv - vec2(0, texelSize.y)).x;
  float T = texture(uPressure, vUv + vec2(0, texelSize.y)).x;
  float div = texture(uDivergence, vUv).x;
  fragColor = vec4((L + R + B + T - div) * 0.25, 0.0, 0.0, 1.0);
}`);

const gradSubProg = prog(`
uniform sampler2D uPressure;
uniform sampler2D uVelocity;
uniform vec2 texelSize;
void main() {
  float L = texture(uPressure, vUv - vec2(texelSize.x, 0)).x;
  float R = texture(uPressure, vUv + vec2(texelSize.x, 0)).x;
  float B = texture(uPressure, vUv - vec2(0, texelSize.y)).x;
  float T = texture(uPressure, vUv + vec2(0, texelSize.y)).x;
  vec2 v = texture(uVelocity, vUv).xy;
  v -= vec2(R - L, T - B) * 0.5;
  fragColor = vec4(v, 0.0, 1.0);
}`);

const splatProg = prog(`
uniform sampler2D uTarget;
uniform vec2 point;
uniform float radius;
uniform vec3 color;
uniform float aspect;
void main() {
  vec2 p = vUv - point;
  p.x *= aspect;
  float d = dot(p, p);
  vec3 splat = exp(-d / radius) * color;
  vec3 base = texture(uTarget, vUv).xyz;
  fragColor = vec4(base + splat, 1.0);
}`);

const curlProg = prog(`
uniform sampler2D uVelocity;
uniform vec2 texelSize;
void main() {
  float L = texture(uVelocity, vUv - vec2(texelSize.x, 0)).y;
  float R = texture(uVelocity, vUv + vec2(texelSize.x, 0)).y;
  float B = texture(uVelocity, vUv - vec2(0, texelSize.y)).x;
  float T = texture(uVelocity, vUv + vec2(0, texelSize.y)).x;
  fragColor = vec4(R - L - T + B, 0.0, 0.0, 1.0);
}`);

const vorticityProg = prog(`
uniform sampler2D uVelocity;
uniform sampler2D uCurl;
uniform vec2 texelSize;
uniform float curl;
uniform float dt;
void main() {
  float L = texture(uCurl, vUv - vec2(texelSize.x, 0)).x;
  float R = texture(uCurl, vUv + vec2(texelSize.x, 0)).x;
  float B = texture(uCurl, vUv - vec2(0, texelSize.y)).x;
  float T = texture(uCurl, vUv + vec2(0, texelSize.y)).x;
  float C = texture(uCurl, vUv).x;
  vec2 force = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));
  float len = length(force) + 1e-5;
  force = force / len * curl * C;
  vec2 v = texture(uVelocity, vUv).xy + force * dt;
  fragColor = vec4(v, 0.0, 1.0);
}`);

const displayProg = prog(`
uniform sampler2D uTexture;
uniform int mode;
void main() {
  vec4 t = texture(uTexture, vUv);
  if (mode == 0) { fragColor = vec4(t.rgb, 1.0); }
  else if (mode == 1) { fragColor = vec4(abs(t.xy) * 5.0, 0.5, 1.0); }
  else if (mode == 2) { float p = t.x * 5.0; fragColor = vec4(max(p,0.0), 0.0, max(-p,0.0), 1.0); }
  else { float c = t.x * 2.0; fragColor = vec4(max(c,0.0), 0.0, max(-c,0.0), 1.0); }
}`);

const bloomBlurProg = prog(`
uniform sampler2D uTexture;
uniform vec2 direction;
uniform vec2 texelSize;
void main() {
  vec3 c = vec3(0.0);
  float w[5]; w[0]=0.227027; w[1]=0.1945946; w[2]=0.1216216; w[3]=0.054054; w[4]=0.016216;
  c += texture(uTexture, vUv).rgb * w[0];
  for (int i = 1; i < 5; i++) {
    vec2 off = direction * texelSize * float(i) * 2.0;
    c += texture(uTexture, vUv + off).rgb * w[i];
    c += texture(uTexture, vUv - off).rgb * w[i];
  }
  fragColor = vec4(c, 1.0);
}`);

const bloomThreshProg = prog(`
uniform sampler2D uTexture;
uniform float threshold;
void main() {
  vec3 c = texture(uTexture, vUv).rgb;
  float brightness = dot(c, vec3(0.2126, 0.7152, 0.0722));
  fragColor = vec4(c * smoothstep(threshold, threshold + 0.3, brightness), 1.0);
}`);

const bloomCompProg = prog(`
uniform sampler2D uScene;
uniform sampler2D uBloom;
uniform float intensity;
void main() {
  vec3 scene = texture(uScene, vUv).rgb;
  vec3 bloom = texture(uBloom, vUv).rgb;
  fragColor = vec4(scene + bloom * intensity, 1.0);
}`);

const clearProg = prog(`
uniform sampler2D uTexture;
uniform float value;
void main() {
  fragColor = value * texture(uTexture, vUv);
}`);

// Geometry
const quad = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quad);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const vao = gl.createVertexArray();
gl.bindVertexArray(vao);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

// FBO helpers
function createFBO(w, h, internalFormat, format, type, filter) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, internalFormat, w, h, 0, format, type, null);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.viewport(0, 0, w, h);
  gl.clear(gl.COLOR_BUFFER_BIT);
  return { texture: tex, fbo, width: w, height: h };
}

function createDoubleFBO(w, h, internalFormat, format, type, filter) {
  return {
    width: w, height: h,
    read: createFBO(w, h, internalFormat, format, type, filter),
    write: createFBO(w, h, internalFormat, format, type, filter),
    swap() { const t = this.read; this.read = this.write; this.write = t; }
  };
}

// State
let velocity, pressure, divergence, curlFBO, dye;
let bloomFBOs = [];

function initFBOs() {
  velocity = createDoubleFBO(simW, simH, gl.RG16F, gl.RG, gl.HALF_FLOAT, texFilter);
  pressure = createDoubleFBO(simW, simH, gl.R16F, gl.RED, gl.HALF_FLOAT, texFilter);
  divergence = createFBO(simW, simH, gl.R16F, gl.RED, gl.HALF_FLOAT, texFilter);
  curlFBO = createFBO(simW, simH, gl.R16F, gl.RED, gl.HALF_FLOAT, texFilter);
  dye = createDoubleFBO(dyeW, dyeH, gl.RGBA16F, gl.RGBA, gl.HALF_FLOAT, texFilter);
  // bloom fbos at quarter res
  const bw = Math.floor(dyeW / 4), bh = Math.floor(dyeH / 4);
  bloomFBOs = [
    createFBO(bw, bh, gl.RGBA16F, gl.RGBA, gl.HALF_FLOAT, texFilter),
    createFBO(bw, bh, gl.RGBA16F, gl.RGBA, gl.HALF_FLOAT, texFilter)
  ];
}

resize();
initFBOs();

window.addEventListener('resize', () => { resize(); initFBOs(); });

// Render helper
function blit(target) {
  if (target) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, target.fbo);
    gl.viewport(0, 0, target.width, target.height);
  } else {
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

function use(p) { gl.useProgram(p.program); return p.uniforms; }

// Controls
let config = {
  viscosity: 0.3, dissipation: 0.98, brushRadius: 0.012,
  force: 300, curl: 30, bloom: 0.6, mode: 0, paused: false
};

function bindSlider(id, key, display) {
  const el = document.getElementById(id);
  const sp = document.getElementById(display);
  el.addEventListener('input', () => { config[key] = parseFloat(el.value); sp.textContent = el.value; });
}
bindSlider('viscosity', 'viscosity', 'v-visc');
bindSlider('dissipation', 'dissipation', 'v-diss');
bindSlider('brush', 'brushRadius', 'v-brush');
bindSlider('force', 'force', 'v-force');
bindSlider('curl', 'curl', 'v-curl');
bindSlider('bloom', 'bloom', 'v-bloom');
document.getElementById('mode').addEventListener('change', e => config.mode = parseInt(e.target.value));
document.getElementById('pause').addEventListener('click', function() {
  config.paused = !config.paused;
  this.textContent = config.paused ? 'Play' : 'Pause';
});
document.getElementById('clear').addEventListener('click', () => {
  const u = use(clearProg);
  gl.uniform1f(u.value, 0);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, velocity.read.texture);
  gl.uniform1i(u.uTexture, 0);
  blit(velocity.write); velocity.swap();
  gl.bindTexture(gl.TEXTURE_2D, dye.read.texture);
  blit(dye.write); dye.swap();
  gl.bindTexture(gl.TEXTURE_2D, pressure.read.texture);
  blit(pressure.write); pressure.swap();
});
document.getElementById('toggle-btn').addEventListener('click', function() {
  const c = document.getElementById('controls');
  c.classList.toggle('collapsed');
  this.textContent = c.classList.contains('collapsed') ? '▶ Controls' : '▼ Controls';
});

// Pointer
let pointers = [{ id: -1, down: false, x: 0, y: 0, dx: 0, dy: 0, color: [0,0,0] }];

function getPointer(id) {
  let p = pointers.find(p => p.id === id);
  if (!p) { p = { id, down: false, x: 0, y: 0, dx: 0, dy: 0, color: [0,0,0] }; pointers.push(p); }
  return p;
}

function hslToRgb(h) {
  const s = 1, l = 0.5;
  const c = (1 - Math.abs(2*l - 1)) * s;
  const x = c * (1 - Math.abs((h/60) % 2 - 1));
  const m = l - c/2;
  let r,g,b;
  if (h < 60) { r=c;g=x;b=0; }
  else if (h < 120) { r=x;g=c;b=0; }
  else if (h < 180) { r=0;g=c;b=x; }
  else if (h < 240) { r=0;g=x;b=c; }
  else if (h < 300) { r=x;g=0;b=c; }
  else { r=c;g=0;b=x; }
  return [(r+m)*1.2, (g+m)*1.2, (b+m)*1.2]; // boost for neon
}

let hue = 0;
function nextColor() { hue = (hue + 1.7) % 360; return hslToRgb(hue); }

function updatePointer(id, x, y) {
  const p = getPointer(id);
  const rect = canvas.getBoundingClientRect();
  const nx = (x - rect.left) / rect.width;
  const ny = 1.0 - (y - rect.top) / rect.height;
  p.dx = (nx - p.x) * 10;
  p.dy = (ny - p.y) * 10;
  p.x = nx;
  p.y = ny;
}

canvas.addEventListener('mousedown', e => { const p = getPointer(-1); p.down = true; p.color = nextColor(); updatePointer(-1, e.clientX, e.clientY); });
canvas.addEventListener('mousemove', e => { const p = getPointer(-1); if (p.down) updatePointer(-1, e.clientX, e.clientY); });
window.addEventListener('mouseup', () => { getPointer(-1).down = false; });

canvas.addEventListener('touchstart', e => { e.preventDefault(); for (const t of e.changedTouches) { const p = getPointer(t.identifier); p.down = true; p.color = nextColor(); updatePointer(t.identifier, t.clientX, t.clientY); }}, { passive: false });
canvas.addEventListener('touchmove', e => { e.preventDefault(); for (const t of e.changedTouches) updatePointer(t.identifier, t.clientX, t.clientY); }, { passive: false });
canvas.addEventListener('touchend', e => { for (const t of e.changedTouches) getPointer(t.identifier).down = false; });

// Splat
function splat(x, y, dx, dy, color) {
  const aspect = canvas.width / canvas.height;

  let u = use(splatProg);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, velocity.read.texture);
  gl.uniform1i(u.uTarget, 0);
  gl.uniform2f(u.point, x, y);
  gl.uniform1f(u.radius, config.brushRadius);
  gl.uniform3f(u.color, dx * config.force, dy * config.force, 0);
  gl.uniform1f(u.aspect, aspect);
  blit(velocity.write); velocity.swap();

  gl.bindTexture(gl.TEXTURE_2D, dye.read.texture);
  gl.uniform1i(u.uTarget, 0);
  gl.uniform3f(u.color, color[0] * 0.8, color[1] * 0.8, color[2] * 0.8);
  blit(dye.write); dye.swap();
}

// Simulation step
let lastTime = performance.now();
function step(now) {
  requestAnimationFrame(step);
  if (config.paused) return;

  const dt = Math.min((now - lastTime) / 1000, 0.033);
  lastTime = now;

  // Apply splats
  for (const p of pointers) {
    if (p.down && (Math.abs(p.dx) > 0.001 || Math.abs(p.dy) > 0.001)) {
      splat(p.x, p.y, p.dx, p.dy, p.color);
      p.dx *= 0.5; p.dy *= 0.5;
    }
  }

  // Curl
  let u = use(curlProg);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, velocity.read.texture);
  gl.uniform1i(u.uVelocity, 0);
  gl.uniform2f(u.texelSize, 1.0/simW, 1.0/simH);
  blit(curlFBO);

  // Vorticity confinement
  u = use(vorticityProg);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, velocity.read.texture);
  gl.uniform1i(u.uVelocity, 0);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, curlFBO.texture);
  gl.uniform1i(u.uCurl, 1);
  gl.uniform2f(u.texelSize, 1.0/simW, 1.0/simH);
  gl.uniform1f(u.curl, config.curl);
  gl.uniform1f(u.dt, dt);
  blit(velocity.write); velocity.swap();

  // Diffusion via Jacobi (viscosity)
  if (config.viscosity > 0) {
    const alpha = 1.0 / (config.viscosity * dt);
    // Reuse pressure solver structure for diffusion
    // Actually, skip explicit diffusion - numerical diffusion from advection is usually enough
    // and real viscosity solve is expensive. The viscosity slider will control velocity dissipation instead.
  }

  // Advect velocity
  u = use(advectionProg);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, velocity.read.texture);
  gl.uniform1i(u.uVelocity, 0);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, velocity.read.texture);
  gl.uniform1i(u.uSource, 1);
  gl.uniform2f(u.texelSize, 1.0/simW, 1.0/simH);
  gl.uniform1f(u.dt, dt);
  gl.uniform1f(u.dissipation, 1.0 - config.viscosity * 0.01);
  blit(velocity.write); velocity.swap();

  // Divergence
  u = use(divergenceProg);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, velocity.read.texture);
  gl.uniform1i(u.uVelocity, 0);
  gl.uniform2f(u.texelSize, 1.0/simW, 1.0/simH);
  blit(divergence);

  // Clear pressure
  u = use(clearProg);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, pressure.read.texture);
  gl.uniform1i(u.uTexture, 0);
  gl.uniform1f(u.value, 0.8);
  blit(pressure.write); pressure.swap();

  // Pressure solve (Jacobi, 30 iterations)
  u = use(pressureProg);
  gl.uniform2f(u.texelSize, 1.0/simW, 1.0/simH);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, divergence.texture);
  gl.uniform1i(u.uDivergence, 1);
  for (let i = 0; i < 30; i++) {
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, pressure.read.texture);
    gl.uniform1i(u.uPressure, 0);
    blit(pressure.write); pressure.swap();
  }

  // Gradient subtraction
  u = use(gradSubProg);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, pressure.read.texture);
  gl.uniform1i(u.uPressure, 0);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, velocity.read.texture);
  gl.uniform1i(u.uVelocity, 1);
  gl.uniform2f(u.texelSize, 1.0/simW, 1.0/simH);
  blit(velocity.write); velocity.swap();

  // Advect dye
  u = use(advectionProg);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, velocity.read.texture);
  gl.uniform1i(u.uVelocity, 0);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, dye.read.texture);
  gl.uniform1i(u.uSource, 1);
  gl.uniform2f(u.texelSize, 1.0/dyeW, 1.0/dyeH);
  gl.uniform1f(u.dt, dt);
  gl.uniform1f(u.dissipation, config.dissipation);
  blit(dye.write); dye.swap();

  // Display
  let displayTex, displayMode;
  if (config.mode === 0) { displayTex = dye.read.texture; displayMode = 0; }
  else if (config.mode === 1) { displayTex = velocity.read.texture; displayMode = 1; }
  else if (config.mode === 2) { displayTex = pressure.read.texture; displayMode = 2; }
  else { displayTex = curlFBO.texture; displayMode = 3; }

  if (config.mode === 0 && config.bloom > 0) {
    // Bloom pass
    // Threshold
    u = use(bloomThreshProg);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, dye.read.texture);
    gl.uniform1i(u.uTexture, 0);
    gl.uniform1f(u.threshold, 0.3);
    blit(bloomFBOs[0]);

    // Blur horizontal
    u = use(bloomBlurProg);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, bloomFBOs[0].texture);
    gl.uniform1i(u.uTexture, 0);
    gl.uniform2f(u.direction, 1, 0);
    gl.uniform2f(u.texelSize, 1.0/bloomFBOs[0].width, 1.0/bloomFBOs[0].height);
    blit(bloomFBOs[1]);

    // Blur vertical
    gl.bindTexture(gl.TEXTURE_2D, bloomFBOs[1].texture);
    gl.uniform2f(u.direction, 0, 1);
    blit(bloomFBOs[0]);

    // Second blur pass for wider bloom
    gl.bindTexture(gl.TEXTURE_2D, bloomFBOs[0].texture);
    gl.uniform2f(u.direction, 1, 0);
    blit(bloomFBOs[1]);
    gl.bindTexture(gl.TEXTURE_2D, bloomFBOs[1].texture);
    gl.uniform2f(u.direction, 0, 1);
    blit(bloomFBOs[0]);

    // Composite
    u = use(bloomCompProg);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, dye.read.texture);
    gl.uniform1i(u.uScene, 0);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, bloomFBOs[0].texture);
    gl.uniform1i(u.uBloom, 1);
    gl.uniform1f(u.intensity, config.bloom);
    blit(null);
  } else {
    u = use(displayProg);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, displayTex);
    gl.uniform1i(u.uTexture, 0);
    gl.uniform1i(u.mode, displayMode);
    blit(null);
  }
}

requestAnimationFrame(step);
</script>
</body>
</html>
